name: Gridsnap
description: Gridsnap is a Los Angeles-based gaming studio founded in 2024 and part of
  the a16z Speedrun Cohort 002. The studio builds interactive worlds for community,
  powered by user-generated content (UGC), primarily using Unreal Editor for Fortnite
  (UEFN). Its work spans three areas - developing original IP, partnering with influencers
  to create community spaces inside Fortnite, and investing in emerging game developers
  by taking stakes in their projects while providing development support. Gridsnap
  publishes no public API, developer portal, SDKs, or documentation; this profile is
  a company identity record in the API Evangelist network.
